name: OPOWER
description: >-
  Opower is a customer engagement and energy efficiency cloud platform for utilities,
  now delivered as Oracle Utilities Opower after Oracle acquired the company in 2016.
  The platform analyzes hundreds of billions of smart-meter reads to power home energy
  reports, bill forecasting and comparison, usage disaggregation, neighbor comparisons,
  personalized tips, high-bill alerts and thresholds, and multi-channel customer
  notifications for utilities such as PG&E, Exelon and National Grid. For developers,
  Oracle Utilities Opower exposes a RESTful Digital Self Service - Energy Management API
  and an Integration Hub GraphQL API, both secured with OAuth 2.0 client-credentials,
  letting utilities integrate customer, utility-account, usage, billing, disaggregation,
  and notification data into their own digital self-service channels.
