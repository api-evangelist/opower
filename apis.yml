apis:
- name: Oracle Utilities Opower REST API (Digital Self Service - Energy Management)
  description: >-
    RESTful API for viewing and managing Opower customer, utility-account, usage, billing,
    disaggregation, neighbor-comparison, tips, threshold and notification data. HTTP/REST
    with JSON, OAuth 2.0 client-credentials auth, versioning carried in the URL path
    (e.g. customer-data-v2, usage-v1, notification-contact-v1).
